<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie?</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #fce4ec;
            color: #5c3b46;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.65);
            padding: 45px;
            border-radius: 25px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(100, 50, 70, 0.15);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .yes {
            background: #f48fb1;
            color: white;
        }

        .no {
            background: #eeeeee;
            color: #555;
            position: relative;
        }

        button:hover {
            transform: scale(1.05);
        }

        .movie {
            background: #f48fb1;
            color: white;
            min-width: 130px;
        }

        #movieSection {
            display: none;
        }

        /* Fake error popup */
        #fakeError {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .errorBox {
            background: #f5f5f5;
            color: #222;
            width: 330px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            text-align: left;
            font-family: Arial, sans-serif;
        }

        .errorTitle {
            color: #d32f2f;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .errorText {
            font-size: 14px;
            line-height: 1.5;
        }

        .close {
            display: block;
            margin: 20px auto 0;
            background: #d32f2f;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- FIRST QUESTION -->
        <div id="questionSection">
            <h1>Wanna watch something with me? 🎬</h1>

            <p>
                Just you and me... maybe? 👀
            </p>

            <div class="buttons">
                <button class="yes" onclick="sayYes()">
                    Yes 💗
                </button>

                <button class="no" id="noButton" onclick="moveNo()">
                    No 😭
                </button>
            </div>
        </div>


        <!-- MOVIE CHOICES -->
        <div id="movieSection">

            <h1>YAYYY 💗</h1>

            <p>Okay, what do you wanna watch?</p>

            <div class="buttons">

                <button class="movie" onclick="fakeHack('Marvel')">
                    Marvel 🦸
                </button>

                <button class="movie" onclick="fakeHack('Horror')">
                    Horror 👻
                </button>

                <button class="movie" onclick="fakeHack('Romcoms')">
                    Romcoms 💕
                </button>

                <button class="movie" onclick="fakeHack('Whatever nalang')">
                    Whatever nalang 😭
                </button>

            </div>

            <p id="status"></p>

        </div>

    </div>


    <!-- FAKE HACK POPUP -->
    <div id="fakeError">

        <div class="errorBox">

            <div class="errorTitle">
                ⚠ SYSTEM ERROR
            </div>

            <div class="errorText">
                Error. Error. Error.<br><br>

                Unauthorized movie selection detected.<br>
                Security protocol activated.<br><br>

                <b>You have been hacked.</b><br><br>

                Message Shane immediately.
            </div>

            <button class="close" onclick="closeError()">
                OK
            </button>

        </div>

    </div>


    <script>

        // Makes the No button move
        function moveNo() {

            const button = document.getElementById("noButton");

            const maxX = window.innerWidth - button.offsetWidth - 20;
            const maxY = window.innerHeight - button.offsetHeight - 20;

            const randomX = Math.max(10, Math.random() * maxX);
            const randomY = Math.max(10, Math.random() * maxY);

            button.style.position = "fixed";
            button.style.left = randomX + "px";
            button.style.top = randomY + "px";
        }


        // When she clicks Yes
        function sayYes() {

            document.getElementById("questionSection").style.display = "none";

            document.getElementById("movieSection").style.display = "block";
        }


        // Fake hacking message
        function fakeHack(movie) {

            document.getElementById("fakeError").style.display = "flex";
        }


        // Close fake error
        function closeError() {

            document.getElementById("fakeError").style.display = "none";
        }

    </script>

</body>
</html>
